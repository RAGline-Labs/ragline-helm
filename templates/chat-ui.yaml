{{- if .Values.services.chatUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.chatUi.name }}
  labels:
    app: {{ .Values.services.chatUi.name }}
    {{- include "ragline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.chatUi.replicaCount }}
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.services.chatUi.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.chatUi.name }}
        {{- include "ragline.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.services.chatUi.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.services.chatUi.name }}
        image: {{ include "ragline.image" (dict "Values" .Values "repository" .Values.services.chatUi.image.repository) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.services.chatUi.port }}
          name: http
        envFrom:
        - configMapRef:
            name: ragline-config
        {{- if .Values.storage.persistentVolume.enabled }}
        volumeMounts:
        - name: ragline-data
          mountPath: /app/data
          readOnly: false
        {{- end }}
        resources:
          {{- toYaml .Values.services.chatUi.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.services.chatUi.port }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.services.chatUi.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      {{- if .Values.storage.persistentVolume.enabled }}
      volumes:
      - name: ragline-data
        persistentVolumeClaim:
          claimName: ragline-data-pvc
      {{- else }}
      volumes:
      - name: ragline-data
        emptyDir: {}
      {{- end }}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.chatUi.name }}-service
  labels:
    app: {{ .Values.services.chatUi.name }}
    {{- include "ragline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.chatUi.service.type }}
  ports:
  - port: {{ .Values.services.chatUi.service.externalPort }}
    targetPort: {{ .Values.services.chatUi.port }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.services.chatUi.name }}
{{- end }}
