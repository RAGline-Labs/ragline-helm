# LLM Service
{{- if .Values.services.llmSvc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.llmSvc.name }}
  labels:
    app: {{ .Values.services.llmSvc.name }}
    component: llm-service
    {{- include "ragline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.llmSvc.replicaCount }}
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.services.llmSvc.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.llmSvc.name }}
        component: llm-service
        {{- include "ragline.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      
      {{- $waitCfg := merge (dict "enabled" true "image" "busybox:1.36" "minBytes7b" 3900000000 "minBytes70b" 38000000000 "stableSleepSeconds" 15) (.Values.services.llmSvc.waitForModelInit | default dict) }}
      {{- $waitModel := and .Values.storage.llmModelsPV.enabled $waitCfg.enabled }}
      {{- if or .Values.initContainers.fixPermissions.enabled $waitModel }}
      initContainers:
      {{- if .Values.initContainers.fixPermissions.enabled }}
      - name: fix-permissions
        image: {{ .Values.initContainers.fixPermissions.image }}
        command:
          {{- toYaml .Values.initContainers.fixPermissions.command | nindent 10 }}
        securityContext:
          {{- toYaml .Values.initContainers.fixPermissions.securityContext | nindent 10 }}
        volumeMounts:
        {{- if .Values.storage.persistentVolume.enabled }}
        - name: ragline-data
          mountPath: /app/data
        {{- end }}
        {{- if .Values.storage.llmModelsPV.enabled }}
        - name: models-storage
          mountPath: /app/models
        {{- end }}
      {{- end }}
      {{- if $waitModel }}
      - name: wait-for-model-file
        image: {{ $waitCfg.image | quote }}
        envFrom:
        - configMapRef:
            name: ragline-config
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            MODELS_PATH="/app/models"
            SZ="${LLM_MODEL_SIZE:-7b}"
            case "$SZ" in
              7b)  FILE="$MODELS_PATH/mistral-7b-instruct-v0.1.Q4_K_M.gguf" MIN={{ $waitCfg.minBytes7b }} ;;
              70b) FILE="$MODELS_PATH/mistral-70b-instruct-v0.1.Q4_K_M.gguf" MIN={{ $waitCfg.minBytes70b }} ;;
              *)   echo "unknown LLM_MODEL_SIZE=$SZ"; exit 1 ;;
            esac
            STABLE={{ $waitCfg.stableSleepSeconds }}
            echo "Waiting for complete model at $FILE (min bytes $MIN, stable ${STABLE}s)"
            i=0
            while true; do
              if [ -f "$FILE" ]; then
                s1=$(wc -c < "$FILE" | tr -d " ")
                sleep "$STABLE"
                s2=$(wc -c < "$FILE" | tr -d " ")
                if [ "$s1" -eq "$s2" ] && [ "$s1" -ge "$MIN" ]; then
                  echo "Model file ready ($s1 bytes)"
                  exit 0
                fi
                echo "model still growing or too small: $s1 -> $s2 bytes"
              else
                echo "waiting for $FILE ($i)..."
              fi
              i=$((i+1))
              sleep 5
            done
        volumeMounts:
        - name: models-storage
          mountPath: /app/models
      {{- end }}
      {{- end }}

      containers:
      - name: {{ .Values.services.llmSvc.name }}
        image: {{ include "ragline.image" (dict "Values" .Values "repository" .Values.services.llmSvc.image.repository) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.services.llmSvc.port }}
          name: http
        envFrom:
        - configMapRef:
            name: ragline-config
        volumeMounts:
        {{- if .Values.storage.persistentVolume.enabled }}
        - name: ragline-data
          mountPath: /app/data
          readOnly: false
        {{- end }}
        {{- if .Values.storage.llmModelsPV.enabled }}
        - name: models-storage
          mountPath: /app/models
          readOnly: false
        {{- end }}
        resources:
          {{- toYaml .Values.services.llmSvc.resources | nindent 10 }}
        {{- $sp := merge (dict "enabled" true "initialDelaySeconds" 15 "periodSeconds" 15 "timeoutSeconds" 15 "failureThreshold" 80) (.Values.services.llmSvc.startupProbe | default dict) }}
        {{- if and .Values.healthChecks.enabled $sp.enabled }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ $sp.initialDelaySeconds }}
          periodSeconds: {{ $sp.periodSeconds }}
          timeoutSeconds: {{ $sp.timeoutSeconds }}
          failureThreshold: {{ $sp.failureThreshold }}
        {{- end }}
        {{- if .Values.healthChecks.enabled }}
        {{- $live := merge (dict "initialDelaySeconds" 120 "periodSeconds" 120 "timeoutSeconds" 60 "failureThreshold" 3) (.Values.services.llmSvc.livenessProbe | default dict) }}
        {{- $ready := merge (dict "initialDelaySeconds" 15 "periodSeconds" 30 "timeoutSeconds" 30 "failureThreshold" 4) (.Values.services.llmSvc.readinessProbe | default dict) }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          {{- toYaml $live | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: http
          {{- toYaml $ready | nindent 10 }}
        {{- end }}
      volumes:
      {{- if .Values.storage.persistentVolume.enabled }}
      - name: ragline-data
        persistentVolumeClaim:
          claimName: ragline-data-pvc
      {{- end }}
      {{- if .Values.storage.llmModelsPV.enabled }}
      - name: models-storage
        persistentVolumeClaim:
          claimName: llm-models-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.llmSvc.name }}-service
  labels:
    app: {{ .Values.services.llmSvc.name }}
    {{- include "ragline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.llmSvc.service.type }}
  ports:
  - name: http
    port: {{ .Values.services.llmSvc.port }}
    targetPort: http
    protocol: TCP
  selector:
    app: {{ .Values.services.llmSvc.name }}
{{- end }}
